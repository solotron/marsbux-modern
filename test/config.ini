# These environment variables are set by the build process and read by
# test/functional/test_runner.py and test/util/marsbux-util-test.py

[environment]
PACKAGE_NAME=marsbux Core
PACKAGE_BUGREPORT=https://github.com/marsbux-project/marsbux/issues
SRCDIR=/home/solotron/Downloads/marsbux-modern
BUILDDIR=/home/solotron/Downloads/marsbux-modern
EXEEXT=
RPCAUTH=/home/solotron/Downloads/marsbux-modern/share/rpcauth/rpcauth.py

[components]
# Which components are enabled. These are commented out by `configure` if they were disabled when running config.
ENABLE_WALLET=true
USE_SQLITE=true
ENABLE_CLI=true
ENABLE_WALLET_TOOL=true
ENABLE_marsbuxD=true
#ENABLE_FUZZ=true
ENABLE_ZMQ=true
