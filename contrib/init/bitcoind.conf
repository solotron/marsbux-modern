description "marsbux Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env marsbuxD_BIN="/usr/bin/marsbuxd"
env marsbuxD_USER="marsbux"
env marsbuxD_GROUP="marsbux"
env marsbuxD_PIDDIR="/var/run/marsbuxd"
# upstart can't handle variables constructed with other variables
env marsbuxD_PIDFILE="/var/run/marsbuxd/marsbuxd.pid"
env marsbuxD_CONFIGFILE="/etc/marsbux/marsbux.conf"
env marsbuxD_DATADIR="/var/lib/marsbuxd"

expect fork

respawn
respawn limit 5 120
kill timeout 600

pre-start script
    # this will catch non-existent config files
    # marsbuxd will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$marsbuxD_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run marsbuxd."
        echo "The setting must appear in $marsbuxD_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following "
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"marsbux Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$marsbuxD_PIDDIR"
    chmod 0755 "$marsbuxD_PIDDIR"
    chown $marsbuxD_USER:$marsbuxD_GROUP "$marsbuxD_PIDDIR"
    chown $marsbuxD_USER:$marsbuxD_GROUP "$marsbuxD_CONFIGFILE"
    chmod 0660 "$marsbuxD_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$marsbuxD_PIDFILE" \
    --chuid $marsbuxD_USER:$marsbuxD_GROUP \
    --exec "$marsbuxD_BIN" \
    -- \
    -pid="$marsbuxD_PIDFILE" \
    -conf="$marsbuxD_CONFIGFILE" \
    -datadir="$marsbuxD_DATADIR" \
    -disablewallet \
    -daemon

